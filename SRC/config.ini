# WIRELESS_CSV — the wireless-coordination CSV importer as a worker (PLAN-3423.01).
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/wireless_csv/config
[wireless_csv]
enabled = true
# A job arrives on APK.audio/System/Protocols/wireless_csv/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "venue.csv", "text": "..."}
# or with "content_b64" in place of "text". The answer goes to
# APK.audio/System/Protocols/wireless_csv/incoming/result (not retained),
# carrying the same job_id.
# A job whose CSV is larger than this many bytes is answered with an error
# rather than parsed. 8 MiB is far beyond any coordination export seen
# (the largest fixture is 17 kB).
max_job_bytes = 8388608
