# WIRELESS_CSV — the wireless-coordination CSV importer as a worker (PLAN-3423.01).
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/wireless_csv/config
[wireless_csv]
# How this is raised (contracts/DISCOVERY-LIFECYCLE.md, stage 2): compose = up for as
# long as its stack is up; the discovery engine does not supervise it.
raise = compose
enabled = true
# A job arrives on APK.audio/System/Protocols/wireless_csv/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "venue.csv", "text": "..."}
# or with "content_b64" in place of "text". The answer goes to
# APK.audio/System/Protocols/wireless_csv/incoming/result (not retained),
# carrying the same job_id.
# A job whose CSV is larger than this many bytes is answered with an error
# rather than parsed. 8 MiB is far beyond any coordination export seen
# (the largest fixture is 17 kB).
max_job_bytes = 8388608
# Every carrier an imported file names is said under
# APK.audio/System/Protocols/wireless_csv/Device/<id>/<leaf> (ROAD-3519,
# src/carriers.rs): unkept, again every restate_s seconds, and sighted for
# presence at APK.audio/Discovery/wireless_csv/<deviceId>. A file's carriers last
# until the same file is imported again or the worker restarts.
restate_s = 30
# Presence is the runner's: these two keys start its tracker. A carrier not
# restated for this long (a restarted worker forgets its imports) is offline.
presence_protocols = wireless_csv
presence_inactive_after_s = 90
