# apk-worker-wireless-csv — the CSV importer as a worker on the bus (PLAN-3423.01).
#
# Owns: the container entry point that answers `outgoing/job` with
# `incoming/result` by running the parser crate beside it (`importer/`,
# apkaudio-wireless-csv). The job loop is the runner's
# (`apk_plugin_runner::jobs::JobWorker`); the envelope is the kernel's
# (`kernel/`, apkaudio-wireless-kernel, feature `worker`).
#
# BUILT ON apk-plugin-runner, the crate every THICK plugin links. The runner
# publishes the config, the last will, the self-test door and the retained
# `incoming/api` description, and runs the job loop; this crate adds only the
# handler.
#
# ITS OWN WORKSPACE, not a member of DISCOVERY.Engine's. The owner rejected
# workers as THICK plugins (PLAN-3423.01): a worker builds its own image, so
# a broken worker never fails the plugin build and the reverse. `importer/` and
# `kernel/` are members because they are path dependencies below this root.
#
# THE SDK BY TAG, like every THICK plugin (2026-10-30 audit): runner and
# contracts come from APK.plugin.SDK `sdk-v0.5`. In the monorepo,
# `.cargo/config.toml` beside this file (kept out of git by .git/info/exclude)
# patches both back to the checkout, and the Dockerfile passes the same two
# entries as `--config`, so no build fetches GitHub and the lockfile records
# path packages. A standalone clone builds once the next SDK tag carries
# `apk_plugin_runner::jobs` (publishing a tag is the owner's).
[package]
name = "apk-worker-wireless-csv"
version = "0.2.0"
edition = "2024"

[workspace]

[lib]
name = "apk_worker_wireless_csv"
path = "src/lib.rs"

[dependencies]
apk-plugin-runner = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.5" }
apkaudio-contracts = { git = "https://github.com/LikeDotAudio/APK.plugin.SDK", tag = "sdk-v0.5" }
apkaudio-wireless-csv = { path = "importer" }
apkaudio-wireless-kernel = { path = "kernel", features = ["worker"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"

[[bin]]
name = "apk-worker-wireless-csv"
path = "src/bin/apk-worker-wireless-csv.rs"

# The runner's own health probe, compiled from the runner's source file rather
# than copied: it reads the timestamp `serve` writes into /tmp. A dependency's
# binaries are not built for a dependent, so this crate names the file.
[[bin]]
name = "apk-plugin-health"
path = "../../../../../POD.THICK/DISCOVERY.Engine/SRC/RUNNER/src/bin/apk-plugin-health.rs"
